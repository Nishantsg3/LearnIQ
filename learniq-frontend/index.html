<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/src/assets/branding/favicons/favicon-32x32.png" />
    <link rel="apple-touch-icon" href="/src/assets/branding/splash/app-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>LearnIQ | Precision in Assessment</title>
    <meta name="description" content="Elevate your potential with research-backed assessments designed for growth." />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="LearnIQ | Precision in Assessment" />
    <meta property="og:description" content="Elevate your potential with research-backed assessments designed for growth." />
    <meta property="og:image" content="https://learniq-frontend-7oyn.onrender.com/social-preview-banner.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="600" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="LearnIQ | Precision in Assessment" />
    <meta name="twitter:description" content="Elevate your potential with research-backed assessments designed for growth." />
    <meta name="twitter:image" content="https://learniq-frontend-7oyn.onrender.com/social-preview-banner.png" />

    <!-- Editorial Typography: Newsreader (Academic Serif) + Outfit & Inter (Modern Sans Body) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">

    <script>
      (function() {
        try {
          var t = localStorage.getItem('learniq-theme');
          var isDark = t === 'dark' || (!t && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (isDark) {
            document.documentElement.classList.add('dark');
            document.documentElement.style.colorScheme = 'dark';
          } else {
            document.documentElement.classList.remove('dark');
            document.documentElement.style.colorScheme = 'light';
          }
        } catch(e) {}
      })();
    </script>
  </head>
  <body class="bg-[#f8fafc] dark:bg-[#0b0d11] text-slate-900 dark:text-[#f8fafc] m-0 transition-colors duration-150 font-sans">
    <div id="root" class="min-h-screen"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
