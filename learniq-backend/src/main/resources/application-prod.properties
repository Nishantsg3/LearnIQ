spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# ==============================================================================
# HIKARICP CONNECTION POOL CONFIGURATION (NEON POSTGRESQL)
# ==============================================================================

spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.idle-timeout=120000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.keepalive-time=0
spring.datasource.hikari.connection-timeout=25000

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Require explicit production environment variables (prevent falling back to public dev defaults)
app.seed.admin.email=${APP_SEED_ADMIN_EMAIL:none}
app.seed.admin.password=${APP_SEED_ADMIN_PASSWORD:none}
app.jwt.secret=${APP_JWT_SECRET:}
